name: Deploy Vue Docs to dumper/gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dumper-docs
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Build site
        run: |
          cd app
          npm run build

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: elkirrs/dumper
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: dumper
          fetch-depth: 0

      - name: Prepare gh-pages branch
        run: |
          cd dumper
          git checkout gh-pages
          rm -rf ./*

      - name: Copy built site
        run: |
          cp -r app/dist/* dumper/

      - name: Set Git user
        run: |
          cd dumper
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          cd dumper
          git add .
          git commit -m "Update docs from dumper-docs" || echo "Nothing to commit"
          git push origin gh-pages